{% extends "base.html" %}
{% block title %}Edit {{ team.name }} – {{ app_name }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <h2 class="mb-4"><i class="bi bi-pencil"></i> Edit Team</h2>
    <div class="card shadow-sm">
      <div class="card-body">
        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label for="name" class="form-label">Team name <span class="text-danger">*</span></label>
            <input type="text" name="name" id="name" class="form-control" required maxlength="120"
                   value="{{ team.name }}">
          </div>
          <div class="mb-4">
            <label for="description" class="form-label">Description</label>
            <textarea name="description" id="description" class="form-control" rows="3">{{ team.description or '' }}</textarea>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Save</button>
            <a href="{{ url_for('teams.detail', team_id=team.id) }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
